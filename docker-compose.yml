version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: dwh_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dwh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - dwh_network

volumes:
  postgres_data:

networks:
  dwh_network: